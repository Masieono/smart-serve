services:
  smart-serve:
    image: ghcr.io/masieono/smart-serve:latest
    container_name: smart-serve
    ports:
      - "8080:8080"
    volumes:
      - smartserve-data:/data
      - /dev:/dev:ro
    # Two separate gates, both required, and the /dev mount above provides neither.
    #
    # 1. The device cgroup. Docker's default allow-list is null, zero, full, tty,
    #    random, urandom and the ptys. Everything else is denied, so a bind-mounted
    #    /dev is fully visible while every open() returns EPERM — smartctl reports
    #    "Smartctl open device: /dev/nvme0n1 failed: Operation not permitted".
    # 2. CAP_SYS_ADMIN. Once open() succeeds, NVMe reads go through
    #    NVME_IOCTL_ADMIN_CMD, which the kernel guards with this capability and Docker
    #    drops by default. SATA/USB reads use SG_IO and do not need it.
    #
    # See docs/DEPLOYMENT.md.
    device_cgroup_rules:
      - 'a *:* rwm'
    cap_add:
      - SYS_ADMIN
    environment:
      TZ: "Etc/UTC"
    restart: unless-stopped

volumes:
  smartserve-data:
