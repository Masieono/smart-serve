name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    # Pinned rather than ubuntu-latest: the floating label is migrating to a new
    # Ubuntu, and a silent image change should not be able to break a build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Read from go.mod so CI can never disagree with the module about the
          # toolchain version.
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - uses: actions/setup-node@v7
        with:
          # Pinned to the current LTS. The test command below is version-proof, but
          # a fixed version keeps runs reproducible.
          node-version: "24"
      - name: JavaScript tests
        # Explicit file paths, never the directory: `node --test <dir>` only
        # traverses directories on Node 26+, and on the LTS it treats the path as a
        # single module and fails with MODULE_NOT_FOUND.
        run: node --test internal/webui/jstest/*.test.mjs

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (both release platforms)
        # Both platforms, not just amd64. The release job builds amd64 and arm64 together, so
        # an arm64-only breakage — a package missing for the architecture, or a build that
        # needs emulation — would otherwise be found by a user rather than by CI. That is
        # exactly how the image would first reach a Raspberry Pi or an ARM NAS.
        #
        # `push: false`, so this costs build time and nothing else. It is slower than the
        # amd64-only build it replaces, which is the price of vetting the architecture that
        # is otherwise only exercised at release.
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide image tags
        id: meta
        # `latest` is published only for a stable tag. A pre-release tag (v1.1.0-rc1) must not
        # move it: everyone following the default tag would be handed a build that is not the
        # newest stable release, and then silently downgraded again when the real release
        # landed. `type=semver` also strips the `v`, so the tag is `1.0.0` rather than
        # `v1.0.0` — which is what D24 specifies.
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/masieono/smart-serve
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Stamped into the binary so a published image can say which release it is.
          # Without this the Dockerfile's ARG falls back to "dev" and every image ever
          # published reports 0.0.0-dev in the sidebar.
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
