name: Bug report
description: Something is wrong — a wrong reading, a crash, or a drive that will not scan.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Two things make a bug report far easier to act on: the raw `smartctl` output for the
        drive, and how the container was run. Both are asked for below — a report with neither
        is usually a round trip before anyone can even start.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Smart-Serve version
      description: Shown in the sidebar, or from `git describe --tags` in a source checkout.
    validations:
      required: true

  - type: input
    id: drive
    attributes:
      label: Drive
      description: >
        Model, and how it is attached — internal SATA/NVMe, or the USB bridge chip if you
        know it. USB bridges are the usual cause of a drive that will not read.

  - type: textarea
    id: raw
    attributes:
      label: Raw smartctl output
      description: >
        From the device page, press **Show raw output**. Or on the host:
        `docker compose exec smart-serve smartctl -x --json /dev/sdX`. It is long — paste the
        whole thing, and remove the serial number if you would rather not share it.
      render: json

  - type: textarea
    id: deployment
    attributes:
      label: How it is deployed
      description: The compose file or `docker run` command, with any tokens removed.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Container logs
      description: "`docker compose logs --tail=100 smart-serve`"
      render: shell
