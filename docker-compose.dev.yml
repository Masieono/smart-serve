# Local development / preview stack (docs/DEPLOYMENT.md).
#   docker compose -f docker-compose.dev.yml up --build
services:
  smart-serve:
    build:
      context: .
      args:
        # Stamped into the binary so the sidebar can say which revision is running.
        # Pass it explicitly, e.g.
        #   SMARTSERVE_VERSION=$(git describe --tags --always --dirty) \
        #     docker compose -f docker-compose.dev.yml up --build
        # or just use `make docker`, which does that for you.
        VERSION: ${SMARTSERVE_VERSION:-dev}
    image: smart-serve:dev
    container_name: smart-serve-dev
    ports:
      - "8080:8080"
    volumes:
      - smartserve-dev-data:/data
      - /dev:/dev:ro
    # Three separate gates, all required, and the /dev mount above provides none.
    #
    # 1. The device cgroup. Docker's default allow-list is null, zero, full, tty,
    #    random, urandom and the ptys. Everything else is denied, so a bind-mounted
    #    /dev is fully visible while every open() returns EPERM — smartctl reports
    #    "Smartctl open device: /dev/nvme0n1 failed: Operation not permitted".
    # 2. CAP_SYS_ADMIN. A native NVMe read goes through NVME_IOCTL_ADMIN_CMD, which the
    #    kernel guards with this capability and Docker drops by default.
    # 3. CAP_SYS_RAWIO. A drive behind a USB bridge is driven with SG_IO passthrough,
    #    and the kernel refuses a passthrough command that is not on its allow-list
    #    without this capability — "Read NVMe Identify Controller failed: Operation not
    #    permitted" from a USB enclosure while the internal disk reads fine.
    #
    # They fail with the same EPERM, so fix all three together. See docs/DEPLOYMENT.md.
    device_cgroup_rules:
      - 'a *:* rwm'
    cap_add:
      - SYS_ADMIN
      - SYS_RAWIO
    environment:
      TZ: "Etc/UTC"
      SMARTSERVE_LOG_LEVEL: "debug"

volumes:
  smartserve-dev-data:
