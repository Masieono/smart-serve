# Local development / preview stack (docs/DEPLOYMENT.md).
#   docker compose -f docker-compose.dev.yml up --build
services:
  smart-serve:
    build:
      context: .
      args:
        # Stamped into the binary so the sidebar can say which revision is running.
        # Pass it explicitly, e.g.
        #   SMARTSERVE_VERSION=$(git describe --tags --always --dirty) \
        #     docker compose -f docker-compose.dev.yml up --build
        # or just use `make docker`, which does that for you.
        VERSION: ${SMARTSERVE_VERSION:-dev}
    image: smart-serve:dev
    container_name: smart-serve-dev
    ports:
      - "8080:8080"
    volumes:
      - smartserve-dev-data:/data
      - /dev:/dev:ro
    # NVMe S.M.A.R.T. goes through an ioctl the kernel guards with CAP_SYS_ADMIN, which
    # Docker drops by default — without this, the boot drive is visible but every read
    # comes back "Operation not permitted". See docs/DEPLOYMENT.md.
    cap_add:
      - SYS_ADMIN
    environment:
      TZ: "Etc/UTC"
      SMARTSERVE_LOG_LEVEL: "debug"

volumes:
  smartserve-dev-data:
