<!doctype html>
<html lang="en"
      data-theme="{{.Theme}}"
      data-theme-base="{{.ThemeBase}}"
      data-theme-tint="{{.Tint}}"
      style="{{.ThemeVars}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Smart-Serve</title>
  <base href="{{.BaseHref}}">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <div id="app" data-base-path="{{.BasePath}}" data-version="{{.Version}}"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript>
    <p style="padding:24px;font-family:system-ui">Smart-Serve needs JavaScript enabled.</p>
  </noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
